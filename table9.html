<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table9</title>
</head>
<body>
    <table border="1" cellpadding="5" cellspacing="0">
  <!-- Row 1: One top header cell spanning across all columns -->
  <tr>
    <td colspan="4">Header / Top Row</td>
  </tr>
  
  <!-- Row 2: Left cell spans 2 rows, followed by 3 individual cells -->
  <tr>
    <td rowspan="2">Left Box (spans 2 rows)</td>
    <td>Cell 2</td>
    <td>Cell 3</td>
    <td>Cell 4</td>
  </tr>
  
  <!-- Row 3: Continuing under row 2 -->
  <tr>
    <td>Cell 5</td>
    <td>Cell 6</td>
    <td>Cell 7</td>
  </tr>
  
  <!-- Row 4: Bottom row with one wide cell spanning across -->
  <tr>
    <td colspan="4">Bottom Row</td>
  </tr>
</table>
</body>
</html>
