<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     h1::first-letter{
        color: green;
        font-size: 100px;
    }
    h1::after{
        content: "  AUNTY";
        color: blue;
    }
    h1::before{
        content: "HI ";
        color: red; 
    } 
</style>
</head>
<body>
    <h1>RAMYA</h1>
    <h2>sheela aunty</h2>
    <p>This is a paragraph.</p>
</body>
</html>
