<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: chocolate;
        }
        input:focus{
            color:black;
            background-color: purple;
        }
        input:checked+label{
            color: brown;
        }
        li:first-child{
            color: greenyellow;
        }
        li:last-child{
            color: green;
        }
        li:nth-child(2){
            color:wheat;
        }
        li:nth-child(3){
            color: darkslategrey;
        }
        button:hover{
            color:burlywood;
            cursor: pointer;
            background-color: dimgrey;
        }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>SRF</legend>
            <label for="name" >Name</label>
            <input type="text" id="name" placeholder="name">
            <br> <br>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="email">
            <br> <br>
            <label for="password">password</label>
            <input type="password" id="password" placeholder="password">
            <br> <br>
            <input type="checkbox" >
            <label for="checked">css</label>
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
                <li>Item 4</li>
            </ul>
            <button>submit</button>
            <button disabled>registration</button>
        </fieldset>
    </form>
</body>
</html>
